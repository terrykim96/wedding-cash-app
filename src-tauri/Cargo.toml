[package]
name = "wedding-gift-app"
version = "1.0.0"
description = "결혼식 축의금 접수/정산 프로그램"
edition = "2021"
rust-version = "1.90"

[lib]
name = "wedding_gift_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-dialog = "=2.8.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.45", features = ["serde", "clock"] }
rust_xlsxwriter = "=0.99.1"
gethostname = "=1.1.0"
thiserror = "=2.0.21"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
