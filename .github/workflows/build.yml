# Windows / macOS 빌드 (NFR-5.3)
# - 수동 실행: GitHub 저장소 > Actions > build > Run workflow
# - 태그 푸시: git tag v1.0.0 && git push origin v1.0.0
# 결과물은 실행 화면 하단 Artifacts 에서 내려받는다.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (Windows)
        if: matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust (macOS, Intel + Apple Silicon)
        if: matrix.platform == 'macos'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm packages
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: |
          npm run build --prefix ..
          cargo test

      # Windows: 설치 프로그램 없이 실행 파일 하나만 만든다
      - name: Build (Windows exe)
        if: matrix.platform == 'windows'
        run: npx tauri build --no-bundle

      - name: Upload Windows exe
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: wedding-gift-app-windows
          path: src-tauri/target/release/wedding-gift-app.exe
          if-no-files-found: error

      # macOS: Intel/Apple Silicon 공용(universal) .app + .dmg
      - name: Build (macOS app + dmg)
        if: matrix.platform == 'macos'
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Zip macOS app
        if: matrix.platform == 'macos'
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent *.app ../wedding-gift-app-macos-app.zip

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: wedding-gift-app-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/wedding-gift-app-macos-app.zip
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
